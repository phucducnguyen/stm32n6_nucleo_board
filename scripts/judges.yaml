# judges.yaml — schema judges/1
#
# Rule: a verdict counts only from a judge that has rejected a known-bad case.
# Hazard: mutations run on a clean `git archive` export, never the working tree.
#         (build/ is gitignored: link the real build/ into the export read-only.)
#
# A judge is a command whose exit code is the verdict (0 = claim holds). Each
# known_bad case is a mutation applied to the export (run from the export root)
# after which the judge must fail; `expect` names the failure it must show.
# Statuses are uppercase: PROVEN / NOT PROVEN / SKIPPED. See scripts/JUDGES.md.
schema: judges/1
repo: stm32n6
# build/ is gitignored: linked read-only into the export. The mutations below touch scripts/ and sources only.
workspace:
  link: [build]
coverage:
  - {glob: "scripts/test-*.sh", name: "script-test:{basename}"}
  - {dirs: "host/*", name: "host:{basename}"}
  - {dirs: "apps/*", name: "app:{basename}"}
  - {dirs: "patches/*", name: "patches:{basename}"}
judges:
  - id: preflight_gate
    claim: >-
      scripts/preflight-flash.sh accepts a build linked into the BootROM window
      0x34180400 (and within 511 KB) and rejects one linked outside it or missing.
    run: bash scripts/test-preflight.sh
    covers: ["script-test:test-preflight.sh"]
    # the script prints "skip:" and still exits 0 when it finds no good/bad build: demand all three cases ran
    pass_match:
      - "PASS: in-window build passes"
      - "PASS: out-of-window build fails"
      - "PASS: missing build dir fails"
    known_bad:
      - name: out_of_window_build
        # was a no-op `true` (the bad input is a pre-built dir, build/capture etc., linked at 0x34000000 by the
        # axisram1-relink overlay); a case must be a mutation, so now: the gate's window check is switched off
        # and the judge's own out-of-window case must catch that.
        cmd: "sed -i 's/^if (( origin != WINDOW_ORIGIN_HEX )); then$/if false; then/' scripts/preflight-flash.sh"
        match: "FAIL: out-of-window build fails \\(rc=0"
      - name: gate_accepts_wrong_origin
        cmd: sed -i 's/^WINDOW_ORIGIN_HEX="0x34180400"/WINDOW_ORIGIN_HEX="0x34000000"/' scripts/preflight-flash.sh
        match:
          - "FAIL: in-window build passes"
          - "FAIL: out-of-window build fails"
      - name: gate_window_size_collapsed
        cmd: sed -i 's/^WINDOW_LEN_KB=511/WINDOW_LEN_KB=1/' scripts/preflight-flash.sh
        match: "FAIL: in-window build passes"
    proof:
      status: PROVEN
      date: 2026-10-08
      failing_line: "FAIL: in-window build passes (rc=1, wanted pass) [build/cam-dbg]"
      detail: gate_accepts_wrong_origin and gate_window_size_collapsed both rejected on a git archive export with build/ symlinked; the unmutated judge passed 3/3 first. out_of_window_build is a pre-existing bad input, not a mutation (the unmutated judge already passes its 'fails' case on build/capture).

  - id: host_occupancy_bridge
    claim: The occupancy-bridge aggregator debounces counts and the protocol/verify/replay logic parses and emits as specified.
    run: cd host/occupancy-bridge && python3 -m unittest discover -s tests
    covers: ["host:occupancy-bridge"]
    pass_match: "^OK$"
    known_bad:
      - name: debounce_off_by_one
        cmd: sed -i '220s/>=/>/' host/occupancy-bridge/occbridge/aggregator.py
        match: "FAIL: test_first_baseline_zero_is_emitted \\(test_aggregator.TestDebounce"
    proof:
      status: PROVEN
      date: 2026-10-08
      failing_line: "FAIL: test_first_baseline_zero_is_emitted (test_aggregator.TestDebounce.test_first_baseline_zero_is_emitted)"

  - id: host_usage_report
    claim: The usage-report analyzer computes open-hours, utilization and peaks as specified.
    run: cd host/usage-report && python3 -m unittest discover -s tests
    covers: ["host:usage-report"]
    pass_match: "^OK$"
    known_bad:
      - name: open_window_start_exclusive
        cmd: sed -i '86s/start_min <= minute_of_day/start_min < minute_of_day/' host/usage-report/usagereport/analyze.py
        match: "FAIL: test_utilization \\(test_analyze.TestCoreOccupancy"
    proof:
      status: PROVEN
      date: 2026-10-08
      failing_line: "FAIL: test_utilization (test_analyze.TestCoreOccupancy.test_utilization)"

  - id: scripts_syntax
    claim: Every shell script under scripts/ parses (bash -n). No Makefile or CI exists in this repo; this is the only lint-class check.
    # set -e instead of `|| exit 1` (a wrapper the lint refuses); bash -n exits 2 on a syntax error, so fail_exit is [2]
    run: set -e; for f in scripts/*.sh; do bash -n "$f"; done; echo "scripts_syntax: all scripts parse"
    fail_exit: [2]
    pass_match: "all scripts parse"
    known_bad:
      - name: unterminated_if
        cmd: echo 'if true; then' >> scripts/cam-describe.sh
        match: "syntax error: unexpected end of file"
    proof:
      status: PROVEN
      date: 2026-10-26
      failing_line: "scripts/cam-describe.sh: line 60: syntax error: unexpected end of file from `if' command on line 59"

  - id: patch_applies
    claim: >-
      Every patch in patches/patches.yml matches its sha256 and applies cleanly to a copy of its
      pinned Zephyr revision, and the patched copy carries the IMX335 cold-boot fix. Limit: this
      proves the fix is in the source a build uses after `west patch apply`, not that the cold-boot
      race is gone (that stays a bench claim).
    # reads git objects from the linked zephyr/ (git archive into mktemp); never its working tree
    run: bash scripts/check-zephyr-patches.sh
    covers: ["patches:zephyr"]
    requires: ["file:zephyr"]
    setup:
      - link: zephyr
    pass_match:
      - "PASS: zephyr/imx335-cold-boot-init.patch applies to zephyr 1f6485eca254"
      - "PASS: patched copy carries the IMX335 cold-boot fix \\(5 ms settle, bounded retry\\)"
    known_bad:
      - name: patch_target_mismatch
        # a context line no longer matches the pinned imx335.c; sha256 updated so only the apply can fail
        cmd: |-
          f=patches/zephyr/imx335-cold-boot-init.patch
          sed -i 's/drv_data = dev->data;$/drv_data = dev->priv;/' "$f"
          sed -i "s/sha256sum: .*/sha256sum: $(sha256sum "$f" | cut -d' ' -f1)/" patches/patches.yml
        match: "FAIL: zephyr/imx335-cold-boot-init.patch does not apply to zephyr 1f6485eca254"
      - name: patch_sha256_stale
        cmd: sed -i 's/k_msleep(2);/k_msleep(3);/' patches/zephyr/imx335-cold-boot-init.patch
        match: "FAIL: zephyr/imx335-cold-boot-init.patch: sha256 mismatch"
      - name: settle_reverted_comment_kept
        # the T4 settle goes back to 600 us; the "cold-boot hardened" comment stays
        cmd: |-
          f=patches/zephyr/imx335-cold-boot-init.patch
          sed -i 's|^+\t\tk_sleep(K_MSEC(5)); /\* T4 (cold-boot hardened) \*/|+\t\tk_sleep(K_USEC(600)); /* T4 (cold-boot hardened) */|' "$f"
          sed -i "s/sha256sum: .*/sha256sum: $(sha256sum "$f" | cut -d' ' -f1)/" patches/patches.yml
        match: "FAIL: patched copy lacks the IMX335 cold-boot fix \\(drivers/video/imx335.c: no 'k_sleep\\(K_MSEC\\(5\\)\\);'\\)"
      - name: retry_disabled_comment_kept
        # the first failure bails again (no retry); comments unchanged
        cmd: |-
          f=patches/zephyr/imx335-cold-boot-init.patch
          sed -i 's/if (attempt >= 10) {/if (attempt >= 0) {/' "$f"
          sed -i "s/sha256sum: .*/sha256sum: $(sha256sum "$f" | cut -d' ' -f1)/" patches/patches.yml
        match: "FAIL: patched copy lacks the IMX335 cold-boot fix \\(drivers/video/imx335.c: no 'if \\(attempt >= 10\\) \\{'\\)"
      - name: hollow_patch_fix_in_comments
        # every fix line kept only inside a comment, the settle back to K_USEC(601) (red team, 2026-10-26)
        cmd: |-
          f=patches/zephyr/imx335-cold-boot-init.patch
          sed -i -E '/^\+/{s#k_sleep\(K_MSEC\(5\)\);#k_sleep(K_USEC(601)); /* k_sleep(K_MSEC(5)); */#;s#(for \(int attempt = 0; ; attempt\+\+\) \{|if \(ret == 0\) \{|if \(attempt >= 10\) \{|k_msleep\(2\);)#/* \1 */#}' "$f"
          sed -i "s/sha256sum: .*/sha256sum: $(sha256sum "$f" | cut -d' ' -f1)/" patches/patches.yml
        match: "FAIL: patched copy lacks the IMX335 cold-boot fix \\(drivers/video/imx335.c: no 'k_sleep\\(K_MSEC\\(5\\)\\);'\\)"
      - name: base_rev_not_the_pin
        cmd: "sed -i 's/^      base-rev: .*/      base-rev: 0000000000000000000000000000000000000000/' patches/patches.yml"
        match: "FAIL: zephyr/imx335-cold-boot-init.patch: custom.base-rev 000000000000 is not the Zephyr pin 1f6485eca254"
      - name: apply_command_noop
        # west patch apply would run `true` and apply nothing (quoted: a bare `true` is a YAML bool west refuses)
        cmd: "sed -i 's/^    apply-command: git apply$/    apply-command: \"true\"/' patches/patches.yml"
        match: "FAIL: zephyr/imx335-cold-boot-init.patch: apply-command is 'true', expected 'git apply'"
      - name: module_not_zephyr
        cmd: "sed -i 's/^    module: zephyr$/    module: modules\\/hal\\/stm32/' patches/patches.yml"
        match: "FAIL: zephyr/imx335-cold-boot-init.patch: module is 'modules/hal/stm32', expected zephyr"
    proof:
      status: PROVEN
      date: 2026-10-26
      failing_line: "FAIL: zephyr/imx335-cold-boot-init.patch does not apply to zephyr 1f6485eca254: error: patch failed: drivers/video/imx335.c:682"
      detail: >-
        prove.py on 33d031b: clean run passed, 8/8 rejected, including hollow_patch_fix_in_comments
        (fix lines only in comments; the old grep over the whole file passed it) and
        base_rev_not_the_pin. Before: prove.py on 47da570 (apply_command_noop now the quoted "true" west accepts, YAML quotes
        stripped by the check): clean run printed both PASS lines; all six cases rejected:
        patch_target_mismatch, patch_sha256_stale, settle_reverted_comment_kept ("no
        'k_sleep(K_MSEC(5));'"), retry_disabled_comment_kept ("no 'if (attempt >= 10) {'"),
        apply_command_noop ("apply-command is 'true', expected 'git apply'") and module_not_zephyr.
        zephyr/ working tree unchanged.

  - id: firmware_build
    claim: >-
      apps/camera-app builds for nucleo_n657x0_q, from a zephyr/ that carries the IMX335 cold-boot
      patch, and links into the BootROM window.
    # the git apply --reverse --check is read-only on zephyr/ ($PWD, not .., because zephyr/ is a symlink in the export)
    # builds into judge-build/ inside the export: build/ is a shared link, and parallel cases in one build dir collide
    run: git -C zephyr apply --reverse --check "$PWD/patches/zephyr/imx335-cold-boot-init.patch" && echo "firmware_build: zephyr/ carries imx335-cold-boot-init.patch" && PATH="$PWD/.venv/bin:$HOME/STMicroelectronics/STM32CubeProgrammer/bin:$PATH" west build -p -b nucleo_n657x0_q apps/camera-app -d judge-build && bash scripts/preflight-flash.sh judge-build
    class: heavy
    covers: ["app:camera-app"]
    requires: ["file:.venv/bin/west", "file:zephyr", "file:.west"]
    pass_match: "preflight: PASS"
    setup:
      - link: .venv
      - link: zephyr
      - link: modules
      - link: .west
    known_bad:
      - name: axisram1_relink_overlay
        # axisram1 sits at 0x34000000, the BootROM refuses it, preflight must say so (built and rejected 2026-10-26)
        cmd: "printf '/ { chosen { zephyr,sram = &axisram1; }; };\\n' >> apps/camera-app/app.overlay"
        match: "image links to 0x34000000, not the BootROM window"
      - name: zephyr_lacks_patch
        # the patch no longer matches what zephyr/ carries (as after a west update without west patch apply)
        cmd: sed -i 's/k_msleep(2);/k_msleep(3);/' patches/zephyr/imx335-cold-boot-init.patch
        match: "error: drivers/video/imx335.c: patch does not apply"
    proof:
      status: PROVEN
      date: 2026-10-26
      failing_line: "image links to 0x34000000, not the BootROM window 0x34180400."
      detail: >-
        prove.py on aab86ae: the clean build plus preflight passed in about 25 s (a full west build,
        not minutes; STM32_SigningTool_CLI is installed, so the image is signed);
        axisram1_relink_overlay rejected by preflight, zephyr_lacks_patch rejected by the reverse
        check ("error: drivers/video/imx335.c: patch does not apply") before any build.

  - id: firmware_build_fresh
    claim: >-
      A fresh Zephyr at the pinned revision, after the documented `west patch -b "$PWD/patches"
      -l "$PWD/patches/patches.yml" apply`, carries the IMX335 cold-boot fix, builds
      apps/camera-app for nucleo_n657x0_q from that tree, and passes the verify-only preflight.
      firmware_build builds against zephyr/, which carries the fix as a hand edit; this one does not.
    # throwaway west workspace under ~/.cache/stm32n6-fresh: git clone --shared of zephyr/ (reads its
    # objects only), modules/ symlinked, .west/config copied; removed on exit
    run: bash scripts/check-fresh-build.sh
    class: heavy
    covers: ["app:camera-app", "patches:zephyr"]
    requires: ["file:.venv/bin/west", "file:zephyr", "file:modules", "file:.west"]
    pass_match:
      - "PASS: west patch apply put the IMX335 cold-boot fix into fresh zephyr 1f6485eca254"
      - "PASS: camera-app built for nucleo_n657x0_q from fresh zephyr 1f6485eca254 with the patched drivers/video/imx335.c"
      - "preflight: PASS \\(verify-only; not flashing\\)"
    setup:
      - link: .venv
      - link: zephyr
      - link: modules
      - link: .west
    known_bad:
      - name: no_patch_step
        # patches.yml lists no patch, so the patch step applies nothing: the fresh tree is stock Zephyr
        cmd: "sed -i '/^patches:$/,$d' patches/patches.yml && echo 'patches: []' >> patches/patches.yml"
        match: "FAIL: fresh zephyr lacks imx335-cold-boot-init.patch after west patch apply"
      - name: hollow_patch_fix_in_comments
        # the fix lines only inside comments, sha256 updated: west applies it, the code check must refuse it
        cmd: |-
          f=patches/zephyr/imx335-cold-boot-init.patch
          sed -i -E '/^\+/{s#k_sleep\(K_MSEC\(5\)\);#k_sleep(K_USEC(601)); /* k_sleep(K_MSEC(5)); */#;s#(for \(int attempt = 0; ; attempt\+\+\) \{|if \(ret == 0\) \{|if \(attempt >= 10\) \{|k_msleep\(2\);)#/* \1 */#}' "$f"
          sed -i "s/sha256sum: .*/sha256sum: $(sha256sum "$f" | cut -d' ' -f1)/" patches/patches.yml
        match: "FAIL: fresh zephyr lacks the IMX335 cold-boot fix \\(drivers/video/imx335.c: no 'k_sleep\\(K_MSEC\\(5\\)\\);'\\)"
      - name: apply_command_noop
        # west patch apply checks the sha256, then runs `true` in zephyr/ instead of git apply
        # (quoted: a bare `true` is a YAML bool and west refuses the file before applying anything)
        cmd: "sed -i 's/^    apply-command: git apply$/    apply-command: \"true\"/' patches/patches.yml"
        match: "FAIL: fresh zephyr lacks imx335-cold-boot-init.patch after west patch apply"
    proof:
      status: PROVEN
      date: 2026-10-26
      failing_line: "FAIL: fresh zephyr lacks imx335-cold-boot-init.patch after west patch apply"
      detail: >-
        prove.py on 20131f1: the clean run printed all three pass lines ("1 patches applied
        successfully", then a full west build from the fresh tree and the verify-only preflight) in
        about 24 s; no_patch_step and apply_command_noop both rejected by the fix-presence check
        before any build (about 5 s each). zephyr/ working tree unchanged.

  - id: host_occupancy_eval
    claim: >-
      The occupancy privacy judges fail every egress family (USB, UVC, network, pixel-out, storage,
      Kconfig, UART blob/binary/noise) and the count scorer computes per-minute MAE, exact, WAPE,
      coverage and peak as specified; the Zephyr webcam build (build/uvc) fails the ELF judge.
      Limit: the st-people people-detect ELF test is skipped in the export (no ../st-people);
      scripts/build-people-detect.sh runs the same judge on that ELF before it signs.
    run: cd host/occupancy-eval && python3 -B -m unittest discover -s tests -v
    covers: ["host:occupancy-eval"]
    pass_match:
      - "^OK"
      - "test_webcam_build_fails .* ok$"
    known_bad:
      - name: uvc_check_off
        cmd: "sed -i 's/(\\^UVCL_|\\^uvc_|_uvc_|\\^update_uvc)/(^NEVERMATCH)/' host/occupancy-eval/privacy_judge.py"
        match: "FAIL: test_webcam_build_fails"
      - name: silent_device_reads_as_empty
        cmd: "sed -i 's/dev = _median_round(valid) if len(valid) \\* 2 > len(samples) else None/dev = _median_round(valid) if valid else 0/' host/occupancy-eval/count_score.py"
        match: "FAIL: test_silent_device_is_missing_not_zero"
    proof:
      status: PROVEN
      date: 2026-10-26
      failing_line: "FAIL: test_webcam_build_fails (test_eval.PrivacyJudgeRealBuilds.test_webcam_build_fails)"
      detail: >-
        prove.py on 61141df: the clean run passed (OK, test_webcam_build_fails ok on build/uvc);
        uvc_check_off and silent_device_reads_as_empty both rejected. The build path itself was run
        on a copy of st-people (ARM GNU 13.3, --no-sign): the default sealed build printed
        "VERDICT: PASS no image egress path linked"; --webcam printed "FAIL P2 no-uvc" and
        "VERDICT: FAIL image egress path or emitter check failed"; the default path forced to UVCL
        printed "build: REFUSED: the sealed image failed the privacy judge (rc 1); not signed." and
        never called the signing tool.
