# Overwatch oversight map — structural intent for this repo.
# A node goes green only when every verify command exits 0; a node with no
# verify command carries no automated evidence and stays yellow, which is the
# honest reading for anything that needs the Zephyr SDK, the board, a camera,
# or a USB DFU session.
project: STM32N6 Camera
nodes:
  app:
    title: Camera app firmware
    parent: project
    purpose: >
      The Zephyr application that runs on the board — USB-UVC webcam sample
      forked into our own app, plus the frame-stats and USB descriptor code
      we own.
    intent: >
      Invariant: the camera image never leaves the device — only anonymous
      usage events are meant to leave the board (see host node). The verify
      command builds the app (Zephyr SDK + .venv on this machine, about 25 s)
      and runs the preflight gate on the image; proving the firmware actually
      works still needs the physical board and camera, which Overwatch does
      not run.
    paths:
      - "apps/camera-app/**"
    verify:
      - "PATH=\"$PWD/.venv/bin:$HOME/STMicroelectronics/STM32CubeProgrammer/bin:$PATH\" west build -p -b nucleo_n657x0_q apps/camera-app -d build/judge-camera-app && bash scripts/preflight-flash.sh build/judge-camera-app"

  board:
    title: Board memory + patches
    parent: project
    purpose: >
      Devicetree overlays that shape the board's RAM layout, plus the one
      upstream driver patch we carry (patches/zephyr/, applied with
      `west patch`).
    intent: >
      Invariant: the BootROM only loads images into the 511 KB window at
      0x34180400 — every overlay here either respects that window or exists
      as a documented dead end (the bigram/axisram_noflex overlays). The
      verify command checks the IMX335 cold-boot patch against a copy of the
      pinned Zephyr revision (never the zephyr/ working tree); overlays are
      checked by the app node's build.
    paths:
      - "overlays/**"
      - "patches/**"
    verify:
      - "bash scripts/check-zephyr-patches.sh"

  tooling:
    title: Build and flash tooling
    parent: project
    purpose: >
      Shell scripts around the build: the SWD dev-flash loop, the serial-boot
      preflight gate, camera capture/describe helpers, and host setup.
    intent: >
      preflight-flash.sh is the one gate standing between a bad link address
      and a burned power-cycle session, so its own regression test is the one
      thing here safe to run unattended. test-preflight.sh auto-discovers a
      known-good and known-bad build under the gitignored build/ directory; on
      a fresh clone with no builds yet it SKIPS those two checks and passes on
      the missing-build-dir check alone, so a green here proves the gate only
      on a machine that has already built.
    paths:
      - "scripts/**"
    verify:
      - "bash scripts/test-preflight.sh"

  host:
    title: Host-side tools
    parent: project
    purpose: >
      The occupancy-bridge (reads board events, forwards them) and
      usage-report (turns events into a readable report) tools that run on
      atlas rather than the board.
    intent: >
      Both packages are stdlib unit-tested; the verify commands run those
      suites.
    paths:
      - "host/**"
    verify:
      - "cd host/occupancy-bridge && python3 -m unittest discover -s tests"
      - "cd host/usage-report && python3 -m unittest discover -s tests"

  docs:
    title: Docs
    parent: project
    purpose: >
      What a reader is promised — the build/flash cheat sheet, the
      architecture note, the boot-ROM/memory facts, the bring-up debug log,
      and the backlog.
    paths:
      - "AGENTS.md"
      - "docs/**"
      - ".gitignore"
